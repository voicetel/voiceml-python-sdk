[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "voiceml"
version = "0.9.4"
description = "Official Python SDK for the VoiceML REST API (Twilio-compatible voice, messaging and AMD from VoiceTel)"
readme = "README.md"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "VoiceTel", email = "support@voicetel.com" }]
keywords = ["voiceml", "voicetel", "telephony", "twilio-compatible", "amd", "voice", "sms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.urls]
Homepage = "https://voicetel.com/docs/api/v0.9/voiceml/"
Documentation = "https://voicetel.com/docs/api/v0.9/voiceml/"
Repository = "https://github.com/voicetel/voiceml-python-sdk"
Issues = "https://github.com/voicetel/voiceml-python-sdk/issues"
Changelog = "https://github.com/voicetel/voiceml-python-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voiceml"]

[tool.hatch.build.targets.sdist]
include = [
    "src/voiceml",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]
# The vendored OpenAPI document is test-only data and is never published.
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/voiceml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
