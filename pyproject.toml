[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "voiceml"
version = "0.7.0"
description = "Official Python SDK for the VoiceML REST API (Twilio-compatible voice + AMD service from VoiceTel)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "VoiceTel", email = "support@voicetel.com" }]
keywords = ["voiceml", "voicetel", "telephony", "twilio-compatible", "amd", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://voiceml.voicetel.com"
Repository = "https://github.com/voicetel/voiceml-python-sdk"
Issues = "https://github.com/voicetel/voiceml-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voiceml"]

[tool.hatch.build.targets.sdist]
include = [
    "src/voiceml",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/voiceml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
