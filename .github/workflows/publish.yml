name: Publish to PyPI

# Publishes the voiceml package to PyPI on every v* tag push, after the full CI
# workflow (lint, type-check, the Python 3.10-3.13 test matrix, minimum-dependency
# tests and the package checks) has passed and the tag matches the package version.
#
# Uses PyPI Trusted Publishing (OIDC) — no token secret needed; the trust
# relationship is configured once at https://pypi.org/manage/account/publishing/ with:
#
#   PyPI Project Name:   voiceml
#   Owner:               voicetel
#   Repository name:     voiceml-python-sdk
#   Workflow filename:   publish.yml
#   Environment name:    pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compare tag with pyproject.toml and voiceml/_version.py
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          if os.environ["REF_TYPE"] != "tag":
              sys.exit("publish must run on a v* tag")
          tag = os.environ["REF_NAME"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          module = re.search(r'"([^"]+)"', open("src/voiceml/_version.py").read()).group(1)
          if not tag == project == module:
              sys.exit(f"tag {tag!r} != pyproject {project!r} / _version.py {module!r}")
          print(f"version {tag} verified")
          EOF

  publish:
    name: Build + publish
    needs: [ci, verify-version]
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing OIDC handshake
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: pip install --upgrade build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: List distribution artifacts
        run: ls -la dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
